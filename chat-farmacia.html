<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farmácia Saúde+ · Atendimento</title>
<style>
  :root{
    --bg:#0b141a;
    --panel:#111b21;
    --header:#202c33;
    --bubble-in:#202c33;
    --bubble-out:#005c4b;
    --text:#e9edef;
    --text-dim:#8696a0;
    --accent:#00a884;
    --input-bg:#2a3942;
    --chat-bg:#0b141a;
    --tick:#53bdeb;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#000;color:var(--text);
    display:flex;align-items:center;justify-content:center;
    height:100dvh;overflow:hidden;
  }
  #app{
    width:100%;max-width:460px;height:100dvh;max-height:900px;
    background:var(--panel);display:flex;flex-direction:column;position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.5);overflow:hidden;
  }
  @media(min-width:480px){ #app{border-radius:12px;height:92dvh} }

  /* ---------- LOGIN ---------- */
  #login{
    position:absolute;inset:0;z-index:20;
    background:linear-gradient(160deg,#005c4b,#0b141a 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px;text-align:center;gap:8px;
  }
  #login .logo{
    width:88px;height:88px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #login h1{font-size:22px;font-weight:600}
  #login p{color:#cfe9e2;font-size:14px;margin-bottom:22px;max-width:280px}
  #login form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px}
  #login input{
    width:100%;padding:14px 16px;border:none;border-radius:10px;font-size:15px;
    background:rgba(255,255,255,.12);color:#fff;outline:none;
    border:1px solid transparent;transition:.2s;
  }
  #login input::placeholder{color:#b9cbc5}
  #login input:focus{background:rgba(255,255,255,.18);border-color:var(--accent)}
  #login button{
    margin-top:6px;padding:14px;border:none;border-radius:10px;cursor:pointer;
    background:var(--accent);color:#04231d;font-size:16px;font-weight:600;transition:.15s;
  }
  #login button:hover{background:#08c79e}
  #login button:active{transform:scale(.98)}
  #login .err{color:#ffd0d0;font-size:13px;min-height:16px}

  /* ---------- HEADER ---------- */
  #chatHeader{
    background:var(--header);display:flex;align-items:center;gap:12px;
    padding:10px 14px;flex-shrink:0;z-index:5;
  }
  #chatHeader .avatar{
    width:40px;height:40px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  }
  #chatHeader .info{flex:1;min-width:0}
  #chatHeader .info .name{font-size:16px;font-weight:600;line-height:1.2}
  #chatHeader .info .status{font-size:12px;color:var(--text-dim);line-height:1.3}
  #chatHeader .info .status.online{color:var(--accent)}
  #logoutBtn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;
    padding:6px 10px;border-radius:6px;
  }
  #logoutBtn:hover{background:rgba(255,255,255,.06);color:var(--text)}

  /* ---------- MESSAGES ---------- */
  #messages{
    flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px;
    background-color:var(--chat-bg);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.015) 0 2px, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.015) 0 2px, transparent 2px);
    background-size:60px 60px;
  }
  #messages::-webkit-scrollbar{width:6px}
  #messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}

  .day-divider{align-self:center;background:var(--header);color:var(--text-dim);
    font-size:12px;padding:5px 12px;border-radius:8px;margin:6px 0;box-shadow:0 1px 1px rgba(0,0,0,.2)}

  .msg{
    max-width:78%;padding:7px 10px 8px;border-radius:8px;font-size:14.5px;line-height:1.4;
    position:relative;word-wrap:break-word;white-space:pre-wrap;
    box-shadow:0 1px .5px rgba(0,0,0,.15);animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.in{align-self:flex-start;background:var(--bubble-in);border-top-left-radius:2px}
  .msg.out{align-self:flex-end;background:var(--bubble-out);border-top-right-radius:2px}
  .msg .meta{
    display:block;text-align:right;font-size:10.5px;color:var(--text-dim);
    margin-top:2px;user-select:none;
  }
  .msg.out .meta{color:rgba(233,237,239,.6)}
  .msg .meta .tick{color:var(--tick);margin-left:2px}

  /* typing indicator */
  .typing{align-self:flex-start;background:var(--bubble-in);padding:12px 14px;border-radius:8px;border-top-left-radius:2px;display:flex;gap:4px}
  .typing span{width:7px;height:7px;background:var(--text-dim);border-radius:50%;animation:blink 1.3s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ---------- COMPOSER ---------- */
  #composer{
    background:var(--header);padding:8px 10px;flex-shrink:0;
  }
  #composerMain,#recBar{display:flex;align-items:flex-end;gap:6px}
  #composer textarea{
    flex:1;resize:none;border:none;outline:none;border-radius:20px;
    background:var(--input-bg);color:var(--text);font-size:15px;font-family:inherit;
    padding:11px 16px;max-height:120px;line-height:1.35;
  }
  #composer textarea::placeholder{color:var(--text-dim)}
  .round-btn{
    width:46px;height:46px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;
    background:var(--accent);color:#04231d;font-size:20px;display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .round-btn:hover{background:#08c79e}
  .round-btn:active{transform:scale(.92)}
  .round-btn:disabled{opacity:.5;cursor:default;transform:none}
  .icon-btn{
    width:44px;height:44px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;
    background:none;color:var(--text-dim);font-size:20px;display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}

  /* barra de gravação */
  #recBar{align-items:center;padding:3px 4px}
  #recBar .rec-live{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:15px}
  #recBar .rec-dot{width:11px;height:11px;border-radius:50%;background:#f15c6d;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  #recBar .rec-hint{flex:1;color:var(--text-dim);font-size:13px;text-align:center}

  /* ---------- ANEXOS NAS BOLHAS ---------- */
  .msg audio{display:block;width:230px;max-width:64vw;margin:2px 0 1px;height:40px}
  .msg .file-card{
    display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);
    padding:10px 12px;border-radius:8px;margin:2px 0 3px;min-width:180px;text-decoration:none;color:inherit;
  }
  .msg .file-card .fico{font-size:26px;flex-shrink:0}
  .msg .file-card .fmeta{min-width:0;flex:1}
  .msg .file-card .fname{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg .file-card .fsize{font-size:12px;color:var(--text-dim);margin-top:2px}
  .msg .file-card .fdl{font-size:18px;color:var(--text-dim)}

  .hidden{display:none!important}
</style>
</head>
<body>
<div id="app">

  <!-- ============ LOGIN ============ -->
  <section id="login">
    <div class="logo">💊</div>
    <h1>Farmácia Saúde+</h1>
    <p>Atendimento virtual. Identifique-se para começar a conversar.</p>
    <form id="loginForm" autocomplete="on">
      <input id="inpName" type="text" placeholder="Seu nome" autocomplete="name" required>
      <input id="inpPhone" type="tel" placeholder="(11) 99999-9999" autocomplete="tel" inputmode="tel" maxlength="15" required>
      <div class="err" id="loginErr"></div>
      <button type="submit">Entrar no atendimento</button>
    </form>
  </section>

  <!-- ============ HEADER ============ -->
  <header id="chatHeader" class="hidden">
    <div class="avatar">💊</div>
    <div class="info">
      <div class="name">Farmácia Saúde+</div>
      <div class="status online" id="agentStatus">online</div>
    </div>
    <button id="logoutBtn" title="Sair">Sair</button>
  </header>

  <!-- ============ MESSAGES ============ -->
  <main id="messages" class="hidden"></main>

  <!-- ============ COMPOSER ============ -->
  <footer id="composer" class="hidden">
    <!-- barra normal -->
    <div id="composerMain">
      <button id="attachBtn" class="icon-btn" title="Anexar documento">📎</button>
      <textarea id="inpMsg" rows="1" placeholder="Digite uma mensagem" maxlength="2000"></textarea>
      <button id="micBtn" class="round-btn" title="Gravar áudio">🎤</button>
      <button id="sendBtn" class="round-btn hidden" title="Enviar">➤</button>
    </div>
    <!-- barra de gravação -->
    <div id="recBar" class="hidden">
      <button id="recCancel" class="icon-btn" title="Cancelar">🗑️</button>
      <div class="rec-live"><span class="rec-dot"></span><span id="recTime">0:00</span></div>
      <div class="rec-hint">gravando… arraste p/ cancelar</div>
      <button id="recSend" class="round-btn" title="Enviar áudio">➤</button>
    </div>
    <input id="fileInput" type="file" class="hidden"
      accept=".pdf,.doc,.docx,.txt,.csv,.xls,.xlsx,image/*,application/pdf">
  </footer>

</div>

<script>
/* ============================================================
   CONFIGURAÇÃO — cole aqui a URL do seu webhook do n8n
   ============================================================ */
const CONFIG = {
  // 👉 COLE A URL DE PRODUÇÃO DO SEU WEBHOOK N8N AQUI:
  webhookUrl: "",

  // Campo(s) que a resposta do n8n pode usar para o texto do agente.
  // O código tenta cada um destes, em ordem, além de aceitar texto puro.
  responseKeys: ["output", "reply", "response", "message", "text", "answer", "resposta"],

  // Como enviar anexos (áudio/documento) ao n8n:
  //  "multipart" → FormData: o arquivo chega como BINÁRIO no nó Webhook (recomendado
  //                para transcrição de áudio / leitura de PDF). Demais campos vão como texto.
  //  "base64"    → tudo em um JSON só, com o arquivo em base64 no campo "attachment".
  attachmentMode: "multipart",

  // Tamanho máximo de anexo (MB)
  maxFileMb: 16,

  // Timeout da requisição (ms)
  timeoutMs: 60000,
};

/* ============================================================
   ESTADO / STORAGE
   ============================================================ */
const LS_USER = "farmacia_user";
const LS_HIST = "farmacia_history";

let user = null;      // { name, phone, sessionId }
let history = [];     // [{ from:'in'|'out', text, ts }]

const $ = id => document.getElementById(id);

/* ============================================================
   HELPERS
   ============================================================ */
function nowTime(ts){
  const d = ts ? new Date(ts) : new Date();
  return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function uid(){
  return "sess-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
}
function onlyDigits(s){ return (s||"").replace(/\D/g,""); }
// Máscara BR: (99) 9999-9999 ou (99) 99999-9999
function maskPhone(v){
  const d = onlyDigits(v).slice(0,11);
  if(d.length === 0) return "";
  if(d.length <= 2) return "(" + d;
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
// Aceita **negrito** simples que o agente possa mandar
function formatText(s){
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<b>$1</b>");
}
function formatBytes(b){
  if(!b && b !== 0) return "";
  if(b < 1024) return b + " B";
  if(b < 1048576) return (b/1024).toFixed(0) + " KB";
  return (b/1048576).toFixed(1) + " MB";
}
function fileIcon(mime, name){
  const m = (mime || "").toLowerCase();
  const ext = (name || "").split(".").pop().toLowerCase();
  if(m.startsWith("image/")) return "🖼️";
  if(m.startsWith("audio/")) return "🎵";
  if(m.includes("pdf") || ext === "pdf") return "📕";
  if(["doc","docx"].includes(ext)) return "📘";
  if(["xls","xlsx","csv"].includes(ext)) return "📗";
  return "📄";
}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function dataURLtoBase64(u){ return (u.split(",")[1] || ""); }

/* ============================================================
   RENDER
   ============================================================ */
function addBubble(from, text, ts, save=true, att=null){
  const el = document.createElement("div");
  el.className = "msg " + (from === "out" ? "out" : "in");
  const tick = from === "out" ? '<span class="tick">✓✓</span>' : "";

  let inner = "";
  if(att){
    if(att.kind === "audio"){
      inner += `<audio controls preload="metadata" src="${att.dataUrl}"></audio>`;
    } else {
      inner += `<a class="file-card" href="${att.dataUrl}" download="${escapeHtml(att.name)}">
          <span class="fico">${fileIcon(att.mime, att.name)}</span>
          <span class="fmeta">
            <span class="fname">${escapeHtml(att.name)}</span>
            <span class="fsize">${formatBytes(att.size)}</span>
          </span>
          <span class="fdl">⬇</span>
        </a>`;
    }
  }
  if(text) inner += `<span class="msg-text">${formatText(text)}</span>`;
  inner += `<span class="meta">${nowTime(ts)}${tick}</span>`;
  el.innerHTML = inner;

  $("messages").appendChild(el);
  scrollDown();
  if(save){
    history.push({ from, text, ts: ts || Date.now(), att });
    saveHistory();
  }
}
// localStorage tem ~5MB; anexos podem estourar. Salva com segurança.
function saveHistory(){
  try{
    localStorage.setItem(LS_HIST, JSON.stringify(history));
  }catch(_){
    // Quota estourou → descarta os anexos mais antigos até caber (mantém o texto)
    for(const m of history){ if(m.att){ m.att = null; } if(tryStore()) return; }
  }
}
function tryStore(){
  try{ localStorage.setItem(LS_HIST, JSON.stringify(history)); return true; }
  catch(_){ return false; }
}
function scrollDown(){
  const m = $("messages");
  m.scrollTop = m.scrollHeight;
}
let typingEl = null;
function showTyping(){
  if(typingEl) return;
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.innerHTML = "<span></span><span></span><span></span>";
  $("messages").appendChild(typingEl);
  $("agentStatus").textContent = "digitando…";
  scrollDown();
}
function hideTyping(){
  if(typingEl){ typingEl.remove(); typingEl = null; }
  $("agentStatus").textContent = "online";
}

/* ============================================================
   REQUISIÇÃO AO AGENTE (n8n)
   ============================================================ */
async function sendToAgent(text, file){
  if(!CONFIG.webhookUrl){
    return "⚠️ Webhook não configurado. Abra o arquivo e cole a URL do n8n em CONFIG.webhookUrl.";
  }

  const meta = {
    message: text || "",
    sessionId: user.sessionId,   // n8n Memory costuma usar como chave da sessão
    user: { name: user.name, phone: user.phone },
    timestamp: new Date().toISOString(),
  };

  let fetchOpts;
  if(file && CONFIG.attachmentMode === "multipart"){
    // Arquivo chega como BINÁRIO no nó Webhook do n8n; campos como texto.
    const fd = new FormData();
    fd.append("message", meta.message);
    fd.append("sessionId", meta.sessionId);
    fd.append("user", JSON.stringify(meta.user));
    fd.append("timestamp", meta.timestamp);
    fd.append("type", file.type.startsWith("audio/") ? "audio" : "file");
    fd.append("file", file, file.name);              // binário
    fetchOpts = { method:"POST", body: fd };         // browser define o Content-Type/boundary
  } else if(file){
    // base64 dentro do JSON
    const dataUrl = await fileToDataURL(file);
    meta.type = file.type.startsWith("audio/") ? "audio" : "file";
    meta.attachment = {
      name: file.name, mime: file.type, size: file.size,
      data: dataURLtoBase64(dataUrl),
    };
    fetchOpts = { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(meta) };
  } else {
    fetchOpts = { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(meta) };
  }

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), CONFIG.timeoutMs);
  fetchOpts.signal = controller.signal;

  try{
    const res = await fetch(CONFIG.webhookUrl, fetchOpts);
    clearTimeout(timer);

    if(!res.ok){
      return `⚠️ O atendimento retornou um erro (HTTP ${res.status}). Tente novamente em instantes.`;
    }

    const raw = await res.text();
    return parseAgentReply(raw);

  }catch(err){
    clearTimeout(timer);
    if(err.name === "AbortError"){
      return "⚠️ O atendimento demorou para responder. Tente novamente.";
    }
    return "⚠️ Não consegui falar com o atendimento. Verifique sua conexão e tente de novo.";
  }
}

// Tolerante: aceita JSON (objeto, array, aninhado) ou texto puro
function parseAgentReply(raw){
  raw = (raw || "").trim();
  if(!raw) return "…";

  let data;
  try{ data = JSON.parse(raw); }
  catch(_){ return raw; }   // não é JSON → texto puro

  const pick = obj => {
    if(obj == null) return null;
    if(typeof obj === "string") return obj;
    if(typeof obj === "number" || typeof obj === "boolean") return String(obj);
    for(const k of CONFIG.responseKeys){
      if(obj[k] != null){
        const v = obj[k];
        return typeof v === "string" ? v : pick(v);
      }
    }
    return null;
  };

  if(Array.isArray(data)) data = data[0];
  const found = pick(data);
  if(found) return found;

  // fallback: devolve o JSON legível para não deixar o usuário sem resposta
  return "Recebi esta resposta:\n" + JSON.stringify(data, null, 2);
}

/* ============================================================
   FLUXO DE ENVIO
   ============================================================ */
let sending = false;

// Núcleo: mostra a bolha de saída, chama o agente e mostra a resposta.
async function deliver(text, file, att){
  if(sending) return;
  sending = true;
  setComposerBusy(true);
  addBubble("out", text, Date.now(), true, att);

  showTyping();
  const reply = await sendToAgent(text, file);
  hideTyping();
  addBubble("in", reply);

  sending = false;
  setComposerBusy(false);
}

async function handleSend(){
  const inp = $("inpMsg");
  const text = inp.value.trim();
  if(!text || sending) return;
  inp.value = "";
  autoGrow(inp);
  toggleMicSend();
  await deliver(text, null, null);
  inp.focus();
}

// Recebe um File (documento escolhido ou áudio gravado) e envia.
async function handleFile(file){
  if(!file || sending) return;
  if(file.size > CONFIG.maxFileMb * 1048576){
    alert(`Arquivo muito grande. Máximo permitido: ${CONFIG.maxFileMb} MB.`);
    return;
  }
  const dataUrl = await fileToDataURL(file);
  const att = {
    kind: file.type.startsWith("audio/") ? "audio" : "file",
    dataUrl, name: file.name, size: file.size, mime: file.type,
  };
  await deliver("", file, att);
}

function setComposerBusy(busy){
  $("sendBtn").disabled = busy;
  $("micBtn").disabled = busy;
  $("attachBtn").disabled = busy;
}

/* ============================================================
   GRAVAÇÃO DE ÁUDIO
   ============================================================ */
let mediaRecorder = null, recChunks = [], recStream = null;
let recTimer = null, recStart = 0, recCancelled = false;

async function startRec(){
  if(sending) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){
    alert("Seu navegador não suporta gravação de áudio."); return;
  }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({ audio:true });
  }catch(_){
    alert("Não consegui acessar o microfone. Verifique a permissão do navegador."); return;
  }
  recChunks = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
             : MediaRecorder.isTypeSupported("audio/mp4")  ? "audio/mp4" : "";
  mediaRecorder = new MediaRecorder(recStream, mime ? { mimeType:mime } : undefined);
  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = onRecStop;
  recCancelled = false;
  mediaRecorder.start();
  showRecBar();
  recStart = Date.now();
  updateRecTime();
  recTimer = setInterval(updateRecTime, 250);
}
function updateRecTime(){
  const s = Math.floor((Date.now() - recStart) / 1000);
  $("recTime").textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function stopRec(cancel){
  recCancelled = !!cancel;
  clearInterval(recTimer);
  if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  hideRecBar();
}
function onRecStop(){
  if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  const blob = new Blob(recChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || "audio/webm" });
  recChunks = [];
  if(recCancelled || blob.size < 700) return;   // cancelado ou áudio vazio
  const ext = /mp4|mpeg|m4a/.test(blob.type) ? "m4a" : "webm";
  const file = new File([blob], `audio-${Date.now()}.${ext}`, { type: blob.type });
  handleFile(file);
}
function showRecBar(){ $("composerMain").classList.add("hidden"); $("recBar").classList.remove("hidden"); }
function hideRecBar(){ $("recBar").classList.add("hidden"); $("composerMain").classList.remove("hidden"); }

// Alterna botão de microfone / enviar conforme houver texto
function toggleMicSend(){
  const hasText = $("inpMsg").value.trim().length > 0;
  $("sendBtn").classList.toggle("hidden", !hasText);
  $("micBtn").classList.toggle("hidden", hasText);
}

/* ============================================================
   LOGIN / LOGOUT
   ============================================================ */
function doLogin(e){
  e.preventDefault();
  const name = $("inpName").value.trim();
  const phoneRaw = $("inpPhone").value.trim();
  const phone = onlyDigits(phoneRaw);

  if(name.length < 2){ return showLoginErr("Digite seu nome."); }
  if(phone.length < 10){ return showLoginErr("Digite um telefone válido com DDD."); }

  user = { name, phone, sessionId: uid() };
  localStorage.setItem(LS_USER, JSON.stringify(user));
  enterChat(true);
}
function showLoginErr(msg){ $("loginErr").textContent = msg; }

function logout(){
  if(!confirm("Sair do atendimento? Sua conversa será apagada deste dispositivo.")) return;
  localStorage.removeItem(LS_USER);
  localStorage.removeItem(LS_HIST);
  user = null; history = [];
  $("messages").innerHTML = "";
  $("chatHeader").classList.add("hidden");
  $("messages").classList.add("hidden");
  $("composer").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("inpName").value = ""; $("inpPhone").value = ""; $("loginErr").textContent = "";
}

function enterChat(fresh){
  $("login").classList.add("hidden");
  $("chatHeader").classList.remove("hidden");
  $("messages").classList.remove("hidden");
  $("composer").classList.remove("hidden");

  // Divisor de dia
  const div = document.createElement("div");
  div.className = "day-divider";
  div.textContent = "Hoje";
  $("messages").appendChild(div);

  // Restaura histórico
  if(history.length){
    history.forEach(m => addBubble(m.from, m.text, m.ts, false));
  } else if(fresh){
    // Saudação de boas-vindas (local, não vai ao agente)
    setTimeout(()=>{
      addBubble("in", `Olá, ${user.name.split(" ")[0]}! 👋\nSou o atendente virtual da *Farmácia Saúde+*. Como posso te ajudar hoje?`);
    }, 400);
  }
  $("inpMsg").focus();
}

/* ============================================================
   COMPOSER UX
   ============================================================ */
function autoGrow(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  // eventos
  $("loginForm").addEventListener("submit", doLogin);
  const phoneInp = $("inpPhone");
  phoneInp.addEventListener("input", ()=>{ phoneInp.value = maskPhone(phoneInp.value); });
  $("sendBtn").addEventListener("click", handleSend);
  $("logoutBtn").addEventListener("click", logout);
  const inp = $("inpMsg");
  inp.addEventListener("input", ()=>{ autoGrow(inp); toggleMicSend(); });
  inp.addEventListener("keydown", e=>{
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); handleSend(); }
  });

  // anexos
  $("attachBtn").addEventListener("click", ()=>$("fileInput").click());
  $("fileInput").addEventListener("change", e=>{
    const f = e.target.files[0];
    if(f) handleFile(f);
    e.target.value = "";   // permite reenviar o mesmo arquivo
  });

  // áudio
  $("micBtn").addEventListener("click", startRec);
  $("recSend").addEventListener("click", ()=>stopRec(false));
  $("recCancel").addEventListener("click", ()=>stopRec(true));

  // sessão salva?
  try{
    const savedUser = JSON.parse(localStorage.getItem(LS_USER) || "null");
    const savedHist = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
    if(savedUser && savedUser.sessionId){
      user = savedUser;
      history = Array.isArray(savedHist) ? savedHist : [];
      enterChat(false);
    }
  }catch(_){ /* storage corrompido → ignora */ }
}
init();
</script>
