x-app: &app
    build:
        context: .
        dockerfile: docker/production/Dockerfile
        target: php
    image: organization-platform/app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    depends_on:
        pgsql:
            condition: service_healthy
        redis:
            condition: service_healthy
    volumes:
        - app-storage:/var/www/html/storage/app/public
        - app-private:/var/www/html/storage/app/private
        - app-backups:/var/www/html/storage/app/backups
    networks: [app]

services:
    app:
        <<: *app

    web:
        build:
            context: .
            dockerfile: docker/production/Dockerfile
            target: nginx
        image: organization-platform/nginx:${APP_IMAGE_TAG:-latest}
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:80"
        depends_on: [app]
        volumes:
            - app-storage:/var/www/html/storage/app/public:ro
        networks: [app]

    horizon:
        <<: *app
        command: php artisan horizon
        stop_grace_period: 60s

    scheduler:
        <<: *app
        command: php artisan schedule:work

    pgsql:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks: [app]

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks: [app]

networks:
    app:

volumes:
    app-storage:
    app-private:
    app-backups:
    postgres-data:
    redis-data:
