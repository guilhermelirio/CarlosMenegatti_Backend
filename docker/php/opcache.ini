; Performance tuning para dev no Windows (bind mount lento).
; OPcache mantém o bytecode compilado em memória e reduz leituras/stat de arquivos.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
; DEV rápido: NÃO revalida timestamps (sem stat storm no bind mount = velocidade consistente).
; Trade-off: após editar código PHP, rode `optimize:clear` + recrie o container p/ refletir.
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1

; realpath cache grande ajuda MUITO em bind mount (resolve caminhos uma vez)
realpath_cache_size=8M
realpath_cache_ttl=600
