; Performance tuning para dev no Windows (bind mount lento).
; OPcache mantém o bytecode compilado em memória e reduz leituras/stat de arquivos.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
; Em desenvolvimento, reflita alterações sem precisar recriar o container.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

; realpath cache grande ajuda MUITO em bind mount (resolve caminhos uma vez)
realpath_cache_size=8M
realpath_cache_ttl=600
